# Copy to inventory.ini and fill in the VM IPs from
# `terraform -chdir=terraform/cluster output`.
[control_plane]
g15-cp1 ansible_host=<CONTROL_PLANE_IP>

[workers]
g15-worker1 ansible_host=<WORKER1_IP>
g15-worker2 ansible_host=<WORKER2_IP>

[kubernetes:children]
control_plane
workers

[kubernetes:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_ed25519
