stages:
- test
default:
  interruptible: true
test:python:
  stage: test
  timeout: 20 minutes
  image: python:3.12-slim-bookworm
  parallel:
    matrix:
    - SUITE:
      - scripts
      - common
      - movie
      - recommendation
      - user
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  script:
  - sh infra/ci-cd/scripts/test-python.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - coverage/scripts/
    - app/backend/*/coverage/
    reports:
      junit:
      - coverage/scripts/tests.xml
      - app/backend/*/coverage/tests.xml
test:frontend:
  stage: test
  timeout: 30 minutes
  image: node:24-bookworm-slim
  script:
  - sh infra/ci-cd/scripts/test-frontend.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - app/frontend/coverage/
    reports:
      junit: app/frontend/coverage/tests.xml
