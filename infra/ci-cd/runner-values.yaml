gitlabUrl: https://gitlab.rnl.tecnico.ulisboa.pt
concurrent: 2
checkInterval: 10
unregisterRunners: false
rbac:
  create: true
  clusterWideAccess: false
  rules:
    - resources: [events]
      verbs: [list, watch]
    - resources: [pods]
      verbs: [create, delete, get, list, watch]
    - resources: [pods/attach, pods/exec]
      verbs: [create, delete, get, patch]
    - resources: [pods/log]
      verbs: [get, list]
    - resources: [secrets]
      verbs: [create, delete, get, update]
    - resources: [serviceaccounts]
      verbs: [get]
    - resources: [services]
      verbs: [create, get]
serviceAccount:
  create: true
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
runners:
  secret: gitlab-runner-token
  config: |
    [[runners]]
      [runners.kubernetes]
        namespace = "g15-ci"
        image = "python:3.12-slim-bookworm"
        privileged = false
        service_account = "ci-job"
        automount_service_account_token = false
        cpu_request = "250m"
        cpu_limit = "1"
        memory_request = "512Mi"
        memory_limit = "1Gi"
        helper_cpu_request = "50m"
        helper_cpu_limit = "250m"
        helper_memory_request = "64Mi"
        helper_memory_limit = "128Mi"
        poll_timeout = 300
