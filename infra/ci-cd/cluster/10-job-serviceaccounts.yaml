# Job-pod identities. ci-build has NO Kubernetes API token. ci-deployer gets a token (the runner mounts it) but its only
# permissions are the Role in 20-deployer-rbac.yaml. The runner MANAGER ServiceAccounts are created by the Helm chart.
apiVersion: v1
kind: ServiceAccount
metadata: {name: ci-build, namespace: g15-build}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ci-deployer, namespace: g15-cd}
automountServiceAccountToken: true
