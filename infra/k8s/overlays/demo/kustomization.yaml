apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../app

# The demo is HTTP on port 30080, restricted to the operator IP by GCP.
# Use HTTPS and secure cookies for a public deployment.
patches:
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: user-service
      spec:
        template:
          spec:
            containers:
              - name: user-service
                env:
                  - name: AUTH_COOKIE_SECURE
                    value: "false"
