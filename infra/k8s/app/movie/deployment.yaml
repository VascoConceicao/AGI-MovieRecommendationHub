# Movie service: gunicorn + Flask, owned database movie-db.
# DATABASE_URL is composed with Kubernetes dependent-variable expansion so
# the password never appears in manifests. /health is the readiness probe
# (503 while the DB is down keeps the Pod out of the Service, without
# restarting it); liveness is a plain TCP check on the process port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-service
  template:
    metadata:
      labels:
        app: movie-service
    spec:
      containers:
        - name: movie-service
          image: g15-movie-service:local
          imagePullPolicy: Never
          volumeMounts:
            - name: posters
              mountPath: /srv/movie-service/assets/posters
          ports:
            - containerPort: 4206
          env:
            - name: USER_SERVICE_URL
              value: "http://user-service:4208"
            - name: MOVIE_DB_USER
              valueFrom:
                configMapKeyRef:
                  name: g15-app-config
                  key: MOVIE_DB_USER
            - name: MOVIE_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: g15-app-config
                  key: MOVIE_DB_NAME
            - name: MOVIE_DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: g15-app-config
                  key: MOVIE_DB_HOST
            - name: MOVIE_DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: g15-app-config
                  key: MOVIE_DB_PORT
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: g15-db-passwords
                  key: MOVIE_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(MOVIE_DB_USER):$(DB_PASSWORD)@$(MOVIE_DB_HOST):$(MOVIE_DB_PORT)/$(MOVIE_DB_NAME)"
          readinessProbe:
            httpGet:
              path: /health
              port: 4206
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4206
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: posters
          persistentVolumeClaim:
            claimName: movie-posters
