worker_processes 1;
pid nginx.pid;
error_log stderr notice;

events {
    worker_connections 256;
}

http {
    client_body_temp_path client_temp;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;
    access_log off;

    server {
        listen 127.0.0.1:4205;
        server_name localhost;

        location /api/movie/ {
            proxy_pass http://127.0.0.1:4206/;
        }

        location /api/recommendation/ {
            proxy_pass http://127.0.0.1:4207/;
        }

        location = /api/user/profile/events {
            proxy_pass http://127.0.0.1:4208/profile/events;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 60s;
        }

        location /api/user/ {
            proxy_pass http://127.0.0.1:4208/;
        }

        location / {
            proxy_pass http://127.0.0.1:4204;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
