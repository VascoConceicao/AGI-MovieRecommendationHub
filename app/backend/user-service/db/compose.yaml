# Shared project name keeps standalone and root launches on the same resources.
name: g15-databases

services:
  user-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: users
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in this service's .env}
    ports:
      - "127.0.0.1:${USER_DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - user-data:/var/lib/postgresql

volumes:
  user-data:
