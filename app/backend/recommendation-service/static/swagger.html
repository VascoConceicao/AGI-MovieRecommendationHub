<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recommendation Service API docs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui.css">
  <style>body { margin: 0; background: #fafafa; } #load-error { padding: 24px; font: 16px system-ui; }</style>
</head>
<body>
  <div id="swagger-ui"></div>
  <p id="load-error" hidden>Could not load API docs. Check your connection or open <a href="swagger.json">swagger.json</a>.</p>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.1/swagger-ui-bundle.js"></script>
  <script>
    (async () => {
      try {
        const response = await fetch('./swagger.json');
        if (!response.ok) throw new Error('Spec unavailable');
        const spec = await response.json();
        // Same-origin server works through either the proxy or direct Flask port.
        spec.servers = [{ url: location.pathname.split('/static/')[0] || '/', description: 'This service' }];
        window.ui = SwaggerUIBundle({
          spec, dom_id: '#swagger-ui', deepLinking: true,
          withCredentials: true, persistAuthorization: false,
          validatorUrl: null,
          presets: [SwaggerUIBundle.presets.apis],
        });
      } catch (error) {
        document.getElementById('load-error').hidden = false;
      }
    })();
  </script>
</body>
</html>
